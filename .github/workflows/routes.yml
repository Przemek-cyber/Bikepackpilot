name: Route plans (SEO)

# Twice a week an agent researches the next route from routes/queue.txt (web search + fact check),
# saves routes/data/<slug>.json and rebuilds the route pages, sitemap.xml and llms.txt.
on:
  schedule:
    - cron: "17 8 * * 2,5"
  workflow_dispatch:
    inputs:
      count:
        description: "How many new routes to research (0 = only rebuild pages)"
        default: "1"
      indexnow_all:
        description: "Notify Bing/IndexNow about ALL pages (not only changed ones)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["routes/data/**", "tools/build_routes.py"]

permissions:
  contents: write

concurrency: routes

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remember starting commit
        id: start
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Research new route
        if: github.event_name != 'push' && (github.event_name == 'schedule' || inputs.count != '0')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          COUNT: ${{ inputs.count || '1' }}
        run: python tools/research_route.py --count "$COUNT"
      - name: Route maps from OpenStreetMap (new routes only)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/osm_geometry.py
      - name: Build pages
        run: python tools/build_routes.py
      - name: Commit
        run: |
          git config user.name "bikepackpilot-bot"
          git config user.email "bikepackpilot-bot@users.noreply.github.com"
          git add routes sitemap.xml robots.txt llms.txt index.html
          git diff --cached --quiet && exit 0
          git commit -q -m "Route plans: update"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Notify search engines (IndexNow → Bing, ChatGPT search)
        if: always()
        env:
          ALL: ${{ inputs.indexnow_all }}
        run: |
          sleep 90   # give GitHub Pages time to publish the new pages
          if [ "$ALL" = "true" ]; then python tools/indexnow.py --all; else python tools/indexnow.py --since ${{ steps.start.outputs.sha }}; fi
